[project]
name = "openclaw-mouse"
version = "1.0.0"
description = "OpenClaw 智能鼠标控制技能 - 生产级桌面自动化框架"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "OpenClaw" }
]
keywords = ["mouse", "automation", "pyautogui", "ai", "agent", "skill", "openclaw", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyautogui>=0.9.54",
    "typer>=0.9.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
openclaw-mouse = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "cli"]
